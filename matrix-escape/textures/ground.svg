<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"><defs>
<radialGradient id="g" cx="0.5" cy="0.5" r="0.75"><stop offset="0" stop-color="#0d1f16"/><stop offset="1" stop-color="#020604"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1a12"/><stop offset="1" stop-color="#050d08"/></linearGradient>
</defs>
<!-- 黑色金属地板基面 -->
<rect width="256" height="256" fill="url(#g)"/>
<!-- 金属面板拼缝 -->
<rect width="128" height="128" fill="url(#panel)"/><rect x="128" width="128" height="128" fill="url(#panel)"/>
<rect y="128" width="128" height="128" fill="url(#panel)"/><rect x="128" y="128" width="128" height="128" fill="url(#panel)"/>
<rect width="256" height="256" fill="none" stroke="#0a1810" stroke-width="1.5"/>
<line x1="128" y1="0" x2="128" y2="256" stroke="#0a1810" stroke-width="1.5"/><line y1="128" x2="256" y2="128" stroke="#0a1810" stroke-width="1.5"/>
<!-- 绿色矩阵网格线(核心特征) -->
<g stroke="#00ff66" stroke-opacity="0.35" stroke-width="2">
<line x1="0" y1="64" x2="256" y2="64"/><line x1="0" y1="128" x2="256" y2="128"/><line x1="0" y1="192" x2="256" y2="192"/>
<line x1="64" y1="0" x2="64" y2="256"/><line x1="128" y1="0" x2="128" y2="256"/><line x1="192" y1="0" x2="192" y2="256"/>
</g>
<!-- 金属高光斑(反光) -->
<ellipse cx="96" cy="160" rx="50" ry="18" fill="#0e2a1c" fill-opacity="0.5"/>
<ellipse cx="200" cy="80" rx="40" ry="14" fill="#0e2a1c" fill-opacity="0.4"/>
<!-- 磨损/划痕细节 -->
<g stroke="#00ff66" stroke-opacity="0.08" stroke-width="1"><line x1="20" y1="220" x2="90" y2="225"/><line x1="160" y1="40" x2="230" y2="46"/><line x1="40" y1="120" x2="70" y2="126"/></g>
</svg>
