<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="720" height="1280"></canvas>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script>
var W=720,H=1280,s=parseInt(new URLSearchParams(location.search).get('scene')||'1');
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();scene.background=new THREE.Color(0x08111f);
scene.fog=new THREE.FogExp2(0x0a1a2c,0.018);
var cam=new THREE.PerspectiveCamera(60,W/H,0.1,600);
scene.add(new THREE.AmbientLight(0x24364e,0.9));
var moon=new THREE.DirectionalLight(0xbfd8ff,1.9);moon.position.set(-40,60,-20);scene.add(moon);
var fill=new THREE.DirectionalLight(0x4a6a8a,0.5);fill.position.set(30,20,40);scene.add(fill);
var warm=new THREE.PointLight(0xffb060,2.2,140);warm.position.set(0,8,0);scene.add(warm);
(function(){var g=new THREE.BufferGeometry(),p=[];for(var i=0;i<400;i++){p.push((Math.random()-0.5)*400,120+Math.random()*200,(Math.random()-0.5)*400);}g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xcfe0ff,size:0.6,sizeAttenuation:true})));})();
var sea=new THREE.Mesh(new THREE.PlaneGeometry(600,600,60,60),
  new THREE.MeshStandardMaterial({color:0x0a1a2e,roughness:0.3,metalness:0.7}));
sea.rotation.x=-Math.PI/2;sea.receiveShadow=true;scene.add(sea);
(function(){var pos=sea.geometry.attributes.position;for(var i=0;i<pos.count;i++){pos.setZ(i,Math.sin(pos.getX(i)*0.15+pos.getY(i)*0.3)*0.25+Math.random()*0.1);}pos.needsUpdate=true;sea.geometry.computeVertexNormals();})();
var impactLight=new THREE.DirectionalLight(0xffb060,0);scene.add(impactLight);
var ship=null,ice=null,loaded=0;
var loader=new THREE.GLTFLoader();
loader.load('ship.glb',function(g){ship=g.scene;ship.traverse(function(o){if(o.isMesh){o.castShadow=true;if(o.material&&o.material.color&&o.material.color.r<0.2){o.material.color.multiplyScalar(1.8);}}});scene.add(ship);check();});
loader.load('iceberg.glb',function(g){ice=g.scene;ice.traverse(function(o){if(o.isMesh){o.castShadow=true;}});scene.add(ice);check();});
function check(){loaded++;if(loaded<2)return;setup();renderer.render(scene,cam);window.__ready=true;}
// 船窗暖灯(船身两侧发光, 外移确保可见) + 船侧暖光
function addLights(){
  var wg=new THREE.PlaneGeometry(0.75,0.85);
  for(var i=0;i<24;i++){
    var wm=new THREE.Mesh(wg,new THREE.MeshStandardMaterial({color:0xffc070,emissive:0xffa040,emissiveIntensity:3.2}));
    wm.position.set(-22+i*1.9,1.5,5.3); ship.add(wm);
    var w2=wm.clone(); w2.position.z=-5.3; w2.rotation.y=Math.PI; ship.add(w2);
  }
  var p1=new THREE.PointLight(0xffb060,2.0,60);p1.position.set(-10,4,8);ship.add(p1);
  var p2=new THREE.PointLight(0xffb060,1.4,60);p2.position.set(10,4,-8);ship.add(p2);
}
function setup(){
  // ship GLB 方向修正: Blender z-船头 → 对齐 -z(前)
  if(ship){ship.rotation.y=Math.PI; addLights();}
  if(ice){ice.scale.setScalar(1.0);}
  if(s===1){ cam.position.set(45,15,72);cam.lookAt(0,5,6);ship.position.set(0,0,10);ship.rotation.y=Math.PI;ice.position.set(-60,-4,-80);}
  else if(s===2){ cam.position.set(26,14,34);cam.lookAt(-20,0,-40);ship.position.set(0,0,20);ship.rotation.y=Math.PI;ice.position.set(-20,-3,-80);ice.scale.setScalar(0.7);}
  else if(s===3){ cam.position.set(42,8,30);cam.lookAt(20,0,-20);ship.position.set(0,0,10);ship.rotation.y=Math.PI-0.18;ice.position.set(30,-3,-40);ice.scale.setScalar(1.15);impactLight.intensity=3;impactLight.position.set(30,10,-20);}
  else if(s===4){ cam.position.set(25,4,40);cam.lookAt(0,2,0);ship.rotation.z=0.16;ship.position.set(0,-1.5,10);warm.intensity=0.8;}
  else if(s===5){ cam.position.set(-14,4,38);cam.lookAt(0,3,0);ship.position.set(0,0,12);ship.rotation.y=Math.PI-0.12;}
  else{ cam.position.set(-18,2,42);cam.lookAt(0,0,6);ship.rotation.z=-0.3;ship.position.set(0,-6,14);warm.intensity=0.15;moon.intensity=0.7;}
}
setTimeout(function(){if(!window.__ready){setup();renderer.render(scene,cam);window.__ready=true;}},8000); // 兜底
</script></body></html>
