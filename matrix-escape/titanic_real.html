<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="720" height="1280"></canvas>
<script src="vendor/three.min.js"></script>
<script>
var W=720,H=1280,s=parseInt(new URLSearchParams(location.search).get('scene')||'1');
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H,false);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
var scene=new THREE.Scene();scene.background=new THREE.Color(0x08111f);
scene.fog=new THREE.FogExp2(0x0a1a2c,0.018);
var cam=new THREE.PerspectiveCamera(60,W/H,0.1,600);
var clock=new THREE.Clock();
// 灯光(写实: 冷月光 + 暖船窗 + 环境)
scene.add(new THREE.AmbientLight(0x24364e,0.9));
var moon=new THREE.DirectionalLight(0xbfd8ff,1.9);moon.position.set(-40,60,-20);scene.add(moon);
var fill=new THREE.DirectionalLight(0x4a6a8a,0.5);fill.position.set(30,20,40);scene.add(fill);
var warm=new THREE.PointLight(0xffb060,2.2,140);warm.position.set(0,8,0);scene.add(warm);
// 星星
(function(){var g=new THREE.BufferGeometry(),p=[];for(var i=0;i<400;i++){p.push((Math.random()-0.5)*400,120+Math.random()*200,(Math.random()-0.5)*400);}g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xcfe0ff,size:0.6,sizeAttenuation:true})));})();
// 海面(写实反光)
var sea=new THREE.Mesh(new THREE.PlaneGeometry(600,600,60,60),
  new THREE.MeshStandardMaterial({color:0x0a1a2e,roughness:0.18,metalness:0.75}));
sea.rotation.x=-Math.PI/2;sea.receiveShadow=true;scene.add(sea);
// 海面波纹(顶点微起伏)
(function(){var pos=sea.geometry.attributes.position;for(var i=0;i<pos.count;i++){pos.setZ(i,Math.sin(pos.getX(i)*0.15+pos.getY(i)*0.3)*0.25+Math.random()*0.1);}pos.needsUpdate=true;sea.geometry.computeVertexNormals();})();
// 冰山(顶点扰动写实)
function makeIce(x,z,scale){
  var geo=new THREE.IcosahedronGeometry(9,2),p=geo.attributes.position;
  for(var i=0;i<p.count;i++){var vx=p.getX(i),vy=p.getY(i),vz=p.getZ(i),n=1+(Math.random()-0.5)*0.35;p.setXYZ(i,vx*n,vy*n,vz*n);}
  geo.computeVertexNormals();
  var m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xdfeefb,roughness:0.92,metalness:0.05,flatShading:false}));
  m.position.set(x,z*0+ (z),0);m.scale.setScalar(scale);m.castShadow=true;return m;
}
var iceberg=makeIce(0,-70,1.6);scene.add(iceberg);
// 船体(写实组合)
var ship=new THREE.Group();
var hullMat=new THREE.MeshStandardMaterial({color:0x2e3a48,roughness:0.35,metalness:0.75});
var decMat=new THREE.MeshStandardMaterial({color:0x3a4654,roughness:0.4,metalness:0.65});
var smokeMat=new THREE.MeshStandardMaterial({color:0x2a1814,roughness:0.6,metalness:0.3});
// 船身
var hull=new THREE.Mesh(new THREE.BoxGeometry(52,7,9),hullMat);hull.position.y=1;hull.castShadow=true;ship.add(hull);
// 船头楔形
var bow=new THREE.Mesh(new THREE.CylinderGeometry(4.4,4.4,12,4,1),hullMat);bow.rotation.z=Math.PI/2;bow.rotation.y=Math.PI/4;bow.position.set(32,1,0);ship.add(bow);
// 上层建筑
var d1=new THREE.Mesh(new THREE.BoxGeometry(30,4,7),decMat);d1.position.set(-2,6.5,0);ship.add(d1);
var d2=new THREE.Mesh(new THREE.BoxGeometry(18,3,5),decMat);d2.position.set(-8,10,0);ship.add(d2);
// 烟囱(4根, 微倾)
for(var ci=0;ci<4;ci++){var sm=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.4,5,16),smokeMat);sm.position.set(-18+ci*7,13,0);sm.rotation.z=-0.1;ship.add(sm);
  var band=new THREE.Mesh(new THREE.CylinderGeometry(1.32,1.32,1,16),new THREE.MeshStandardMaterial({color:0x6a2a1a,roughness:0.5,metalness:0.4}));band.position.set(-18+ci*7,14.6,0);band.rotation.z=-0.1;ship.add(band);}
// 船窗暖灯(发光小面)
var winGeo=new THREE.PlaneGeometry(0.5,0.5);
for(var w=0;w<40;w++){var win=new THREE.Mesh(winGeo,new THREE.MeshStandardMaterial({color:0xffc070,emissive:0xffa040,emissiveIntensity:2.4}));win.position.set(-26+w*1.4,2.2,4.55);ship.add(win);
  var win2=win.clone();win2.position.z=-4.55;win2.rotation.y=Math.PI;ship.add(win2);}
ship.position.set(0,0,20);scene.add(ship);
// 救生艇(小几何)
function lifeboat(x,z,rot){
  var b=new THREE.Mesh(new THREE.CylinderGeometry(2.2,1.6,7,8,1,false,0,Math.PI),new THREE.MeshStandardMaterial({color:0x1c262e,roughness:0.5,metalness:0.5}));
  b.rotation.z=Math.PI/2;b.position.set(x,1,z);b.rotation.y=rot;return b;
}
// ===== 按场景设置(6个写实瞬间) =====
var l1=new THREE.DirectionalLight(0xffb060,0);scene.add(l1); // 冲击补光
if(s===1){ // 夜航全景(侧前, 拉远看全船)
  cam.position.set(45,15,72);cam.lookAt(0,5,6);ship.position.set(0,0,10);iceberg.position.set(-60,-5,-80);
}else if(s===2){ // 瞭望视角(主观, 前方冰山)
  cam.position.set(26,14,34);cam.lookAt(-20,0,-40);ship.position.set(0,0,20);iceberg.position.set(-20,-4,-80);iceberg.scale.setScalar(1.1);
}else if(s===3){ // 撞击(船艏近冰山)
  cam.position.set(42,8,30);cam.lookAt(20,0,-20);ship.position.set(0,0,10);ship.rotation.y=0.18;iceberg.position.set(30,-4,-40);iceberg.scale.setScalar(1.8);
  l1.intensity=3;l1.position.set(30,10,-20);
}else if(s===4){ // 进水倾斜
  cam.position.set(25,4,40);cam.lookAt(0,2,0);ship.rotation.z=0.16;ship.position.set(0,-1.5,10);warm.intensity=0.8;
}else if(s===5){ // 救生艇(前景)
  cam.position.set(-14,4,38);cam.lookAt(0,3,0);var lb=lifeboat(-4,28,0.2);scene.add(lb);ship.position.set(0,0,12);ship.rotation.y=0.12;
}else{ // 沉没(没入+救生艇回望)
  cam.position.set(-18,2,42);cam.lookAt(0,0,6);ship.rotation.z=-0.3;ship.position.set(0,-6,14);warm.intensity=0.15;moon.intensity=0.7;
  var lb2=lifeboat(-6,30,0.3);scene.add(lb2);
}
renderer.render(scene,cam);
window.__ready=true;
</script></body></html>
