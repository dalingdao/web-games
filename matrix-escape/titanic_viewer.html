<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>泰坦尼克 3D建模审片</title>
<style>
body{margin:0;background:#05080f;overflow:hidden;font-family:sans-serif}
#hud{position:fixed;top:12px;left:14px;color:#cfe3ff;font-size:13px;line-height:1.8;background:rgba(8,16,32,.6);padding:10px 14px;border-radius:8px;pointer-events:none;z-index:5}
#hud b{color:#ffd58a}
#hud .s{color:#8fb8e8}
canvas{display:block;touch-action:none}
</style></head>
<body>
<div id="hud"><b>泰坦尼克 3D 建模（真实模型）</b><br>
🖱 左键拖拽 = 旋转　🖱 滚轮 = 缩放　🖱 右键拖拽 = 平移<br>
📱 手机：单指拖动 = 旋转　双指捏合 = 缩放　双指拖动 = 平移<br>
<span class="s">人物姿态：瞭望员指向 / 夫妻相拥 / 母亲抱婴儿</span></div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script>
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0a1420,0.008);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,2000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.4;
document.body.appendChild(renderer.domElement);

// 灯光(月光/暖主光/冷补光)
scene.add(new THREE.AmbientLight(0x223344,0.8));
const moon=new THREE.DirectionalLight(0xaac4ff,2.6);moon.position.set(-60,80,-50);scene.add(moon);
const warm=new THREE.PointLight(0xffa050,2.2,300);warm.position.set(0,20,20);scene.add(warm);
const fill=new THREE.PointLight(0x5a78b8,1.2,200);fill.position.set(40,25,60);scene.add(fill);

// 星空粒子(电影感)
(function(){
  const n=1200, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const th=Math.random()*Math.PI*2, ph=Math.random()*Math.PI*0.5+0.1, r=280+Math.random()*120;
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph); pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0xbfd4ff,size:0.9,sizeAttenuation:true,transparent:true,opacity:0.85}));
  scene.add(pts);
})();

// 手动轨道控制
const target=new THREE.Vector3(0,5,0);
const sph={r:95,th:0.9,ph:1.1};
let dragging=false,rightDrag=false,px=0,py=0;
function applyCam(){
  cam.position.set(
    target.x+sph.r*Math.sin(sph.ph)*Math.sin(sph.th),
    target.y+sph.r*Math.cos(sph.ph),
    target.z+sph.r*Math.sin(sph.ph)*Math.cos(sph.th));
  cam.lookAt(target);
}
addEventListener('mousedown',e=>{if(e.button===0)dragging=true;if(e.button===2)rightDrag=true;px=e.clientX;py=e.clientY;});
addEventListener('mouseup',()=>{dragging=false;rightDrag=false;});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{
  const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
  if(dragging){sph.th-=dx*0.005;sph.ph=Math.max(0.05,Math.min(Math.PI-0.05,sph.ph-dy*0.005));}
  if(rightDrag){
    const f=sph.r*0.0015;
    const fx=new THREE.Vector3().subVectors(cam.position,target).normalize().cross(cam.up).normalize();
    const fy=new THREE.Vector3().crossVectors(fx,cam.up).normalize();
    target.addScaledVector(fx,-dx*f).addScaledVector(fy,dy*f);
  }
  applyCam();
});
addEventListener('wheel',e=>{sph.r=Math.max(15,Math.min(400,sph.r*(e.deltaY>0?1.1:0.9)));applyCam();});

// ---- 触控(手机): 单指旋转 / 双指捏合缩放+平移 ----
let pinchDist=0;
addEventListener('touchstart',e=>{
  if(e.touches.length===1){px=e.touches[0].clientX;py=e.touches[0].clientY;}
  else if(e.touches.length===2){
    pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:false});
addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    const dx=e.touches[0].clientX-px,dy=e.touches[0].clientY-py;
    px=e.touches[0].clientX;py=e.touches[0].clientY;
    sph.th-=dx*0.006;sph.ph=Math.max(0.05,Math.min(Math.PI-0.05,sph.ph-dy*0.006));
  } else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinchDist>0){sph.r=Math.max(15,Math.min(400,sph.r*(pinchDist/d)));}
    pinchDist=d;
  }
  applyCam();
},{passive:false});
addEventListener('touchend',e=>{pinchDist=0;},{passive:false});

new THREE.GLTFLoader().load('titanic_stage.glb',g=>{scene.add(g.scene);applyCam();},
undefined,err=>{document.getElementById('hud').innerHTML+='<br><span style="color:#f88">模型加载失败: '+err+'</span>';});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);renderer.render(scene,cam);})();
</script></body></html>
