<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Titanic — 6-Shot Timeline (Real-time)</title>
<style>
  body{margin:0;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#ccc}
  canvas{display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
  .timeline{height:6px;background:rgba(255,255,255,0.08);border-top:1px solid rgba(255,255,255,0.1)}
  .track{height:100%;background:linear-gradient(90deg,#ffb060,#ff6030);transform-origin:left;transform:scaleX(0);transition:transform 0.1s linear}
  .marks{display:flex;height:28px;padding:4px 12px;background:rgba(0,0,0,0.7);border-top:1px solid rgba(255,255,255,0.08)}
  .mark{flex:1;text-align:center;font-size:10px;color:#8aa;position:relative}
  .mark::before{content:'';position:absolute;top:0;left:50%;width:1px;height:8px;background:rgba(255,255,255,0.3);transform:translateX(-50%)}
  .mark.active{color:#ffb060;font-weight:600}
  .info{position:fixed;left:12px;top:12px;pointer-events:none;font-size:12px;line-height:1.6;text-shadow:0 0 4px #000}
  .shot-label{font-size:13px;font-weight:600;color:#ffb060}
  .timecode{font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div id="ui">
  <div class="timeline"><div class="track" id="track"></div></div>
  <div class="marks" id="marks"></div>
</div>
<div class="info" id="info"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script>
// ========== Config ==========
const W = 720, H = 1280;
const SHOT_DURATION = 10; // seconds per shot
const TOTAL_TIME = 60;

// ========== Render Setup ==========
const out = document.createElement('canvas');
out.width = W; out.height = H;
document.body.appendChild(out);
const octx = out.getContext('2d');

const glc = document.createElement('canvas');
glc.width = W; glc.height = H;
const renderer = new THREE.WebGLRenderer({canvas: glc, antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ========== Scene ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08111f);
scene.fog = new THREE.FogExp2(0x0a1a2c, 0.016);

const cam = new THREE.PerspectiveCamera(60, W / H, 0.1, 600);

// Enable depth of field via post (bokeh simulation)
cam.focus = 30;
cam.aperture = 0.02;

// Lights — Studio setup
scene.add(new THREE.AmbientLight(0x24364e, 0.9));

const moon = new THREE.DirectionalLight(0xbfd8ff, 1.9);
moon.position.set(-40, 60, -20);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.near = 10;
moon.shadow.camera.far = 200;
moon.shadow.camera.left = -60;
moon.shadow.camera.right = 60;
moon.shadow.camera.top = 60;
moon.shadow.camera.bottom = -60;
scene.add(moon);

const fill = new THREE.DirectionalLight(0x4a6a8a, 0.5);
fill.position.set(30, 20, 40);
scene.add(fill);

const warm = new THREE.PointLight(0xffb060, 2.2, 140);
warm.position.set(0, 8, 0);
warm.castShadow = true;
scene.add(warm);

const alarm = new THREE.PointLight(0xff3020, 0, 200);
scene.add(alarm);

const impact = new THREE.DirectionalLight(0xffb060, 0);
scene.add(impact);

// Stars
(function(){
  const g = new THREE.BufferGeometry(), p = [];
  for(let i=0;i<400;i++) p.push((Math.random()-0.5)*400, 120+Math.random()*200, (Math.random()-0.5)*400);
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0xcfe0ff, size:0.6, sizeAttenuation:true})));
})();

// Sea — displaced plane
const seaGeo = new THREE.PlaneGeometry(600, 600, 80, 80);
const seaMat = new THREE.MeshStandardMaterial({color: 0x0a1a2e, roughness: 0.25, metalness: 0.85});
const sea = new THREE.Mesh(seaGeo, seaMat);
sea.rotation.x = -Math.PI/2;
sea.receiveShadow = true;
scene.add(sea);

// Bake wave displacement
(function(){
  const pos = seaGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i, Math.sin(x*0.12 + y*0.25)*0.22 + Math.sin(x*0.07 - y*0.18)*0.15);
  }
  pos.needsUpdate = true;
  seaGeo.computeVertexNormals();
})();

// Ice particles (shot 3)
function makeParticles(n, color, size, box){
  const g = new THREE.BufferGeometry(), p = [], v = [];
  for(let i=0;i<n;i++){
    p.push(box.x + (Math.random()-0.5)*box.w, box.y + (Math.random()-0.5)*box.h, box.z + (Math.random()-0.5)*box.d);
    v.push((Math.random()-0.5)*8, (Math.random()+0.5)*4, (Math.random()-0.5)*8);
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  const m = new THREE.Points(g, new THREE.PointsMaterial({color, size, transparent:true, opacity:0.9, sizeAttenuation:true}));
  g.setAttribute('vel', new THREE.Float32BufferAttribute(v, 3));
  return m;
}
const iceP = makeParticles(400, 0xdcecf8, 0.5, {x:30,y:2,z:-20,w:10,h:8,d:10});
iceP.visible = false; scene.add(iceP);

const waterP = makeParticles(300, 0x7ab0e0, 0.6, {x:0,y:0,z:12,w:50,h:3,d:15});
waterP.visible = false; scene.add(waterP);

// Lifeboat (shot 5)
const lbGeo = new THREE.CylinderGeometry(2.2, 1.6, 7, 8, 1, false, 0, Math.PI);
const lbMat = new THREE.MeshStandardMaterial({color:0x1c262e, roughness:0.5, metalness:0.5});
const lifeboat = new THREE.Mesh(lbGeo, lbMat);
lifeboat.rotation.z = Math.PI/2;
lifeboat.rotation.y = 0.2;
lifeboat.position.set(-6, 1, 28);
lifeboat.castShadow = true;
lifeboat.visible = false;
scene.add(lifeboat);

// Mist plane (shot 5)
const mistGeo = new THREE.PlaneGeometry(140, 30);
const mistMat = new THREE.MeshBasicMaterial({color:0x9fb6cc, transparent:true, opacity:0.14, depthWrite:false});
const mist = new THREE.Mesh(mistGeo, mistMat);
mist.rotation.x = -Math.PI/2;
mist.position.set(-8, 0.5, 34);
mist.visible = false;
scene.add(mist);

// ========== Silhouette People ==========
const darkMat = new THREE.MeshStandardMaterial({color:0x0a0c10, roughness:0.95, metalness:0.0});
function person(scale=1){
  const g = new THREE.Group();
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 10), darkMat);
  head.position.y = 3.4; head.castShadow = true; g.add(head);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.42, 1.5, 10), darkMat);
  body.position.y = 2.35; body.castShadow = true; g.add(body);
  const legGeo = new THREE.CylinderGeometry(0.22, 0.18, 1.8, 8);
  const l1 = new THREE.Mesh(legGeo, darkMat); l1.position.set(-0.18, 1.1, 0); l1.castShadow = true; g.add(l1);
  const l2 = new THREE.Mesh(legGeo, darkMat); l2.position.set(0.18, 1.1, 0); l2.castShadow = true; g.add(l2);
  g.scale.setScalar(scale);
  return g;
}

// Lookout (shots 1-2)
const lookout = person(1);
lookout.position.set(0, 6, -26);
lookout.rotation.y = Math.PI;
scene.add(lookout);

// Deck passengers (shot 1)
const deckPeople = [];
for(let i=0;i<7;i++){
  const p = person(0.75);
  p.position.set(-14 + i*4.5, 6.6, 18 + (i%2)*2);
  p.rotation.y = Math.PI;
  scene.add(p);
  deckPeople.push(p);
}

// Lifeboat people (shot 5)
const boatPeople = [];
for(let i=0;i<3;i++){
  const p = person(0.85);
  p.position.set(-8 + i*2.2, 1.4, 28 - i*0.6);
  p.rotation.y = Math.PI*0.9;
  scene.add(p);
  boatPeople.push(p);
}

// ========== Load GLB Models ==========
let ship = null, iceberg = null, loaded = 0;
new THREE.GLTFLoader().load('ship.glb', gltf => {
  ship = gltf.scene;
  ship.traverse(o => {
    if(o.isMesh){
      o.castShadow = true;
      o.receiveShadow = true;
      if(o.material && o.material.color && o.material.color.r < 0.2){
        o.material.color.multiplyScalar(1.8);
      }
    }
  });
  scene.add(ship);
  addWindowLights();
  checkReady();
});
new THREE.GLTFLoader().load('iceberg.glb', gltf => {
  iceberg = gltf.scene;
  iceberg.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; }});
  scene.add(iceberg);
  checkReady();
});
function checkReady(){ if(++loaded === 2) initTimeline(); }

// Window lights on ship
function addWindowLights(){
  if(ship.userData.lit) return;
  ship.userData.lit = true;
  const wg = new THREE.PlaneGeometry(0.75, 0.85);
  for(let i=0;i<24;i++){
    const wm = new THREE.Mesh(wg, new THREE.MeshStandardMaterial({color:0xffc070, emissive:0xffa040, emissiveIntensity:3.5}));
    wm.position.set(-22 + i*1.9, 1.5, 5.3); ship.add(wm);
    const w2 = wm.clone(); w2.position.z = -5.3; w2.rotation.y = Math.PI; ship.add(w2);
  }
  const p1 = new THREE.PointLight(0xffb060, 2.2, 70); p1.position.set(-10, 4, 8); p1.castShadow = true; ship.add(p1);
  const p2 = new THREE.PointLight(0xffb060, 1.6, 70); p2.position.set(10, 4, -8); p2.castShadow = true; ship.add(p2);
}

// ========== Shot Data (Timeline) ==========
// Each shot: 10 seconds. camS/camE = camera pos, lookS/lookE = lookAt target, shipState = [posY, rotZ, rotY]
const SHOTS = [
  // Shot 1: Night sail (0-10s)
  { cs:[44,13,64], ce:[36,10.5,48], ls:[0,6,6], le:[0,6,10], ss:[0,0,Math.PI], se:[0,0,Math.PI], warm:2.2, alarm:0, impact:0, name:"夜航 · Night Sail" },
  // Shot 2: Lookout (10-20s)
  { cs:[28,15,36], ce:[24,13,32], ls:[0,2,-70], le:[-10,0,-80], ss:[0,0,Math.PI], se:[0,0,Math.PI], warm:1.4, alarm:1.6, impact:0, name:"瞭望 · Lookout" },
  // Shot 3: Impact (20-30s)
  { cs:[44,7,26], ce:[40,6,20], ls:[25,2,-25], le:[28,1,-28], ss:[0,0,Math.PI-0.1], se:[0,0,Math.PI-0.2], warm:1.2, alarm:0.8, impact:3, name:"撞击 · Impact" },
  // Shot 4: Flooding (30-40s)
  { cs:[25,4,40], ce:[28,6,30], ls:[0,2,0], le:[0,1,4], ss:[0,0,Math.PI], se:[-2,0.25,Math.PI-0.15], warm:1.0, alarm:0.3, impact:0, name:"进水 · Flooding" },
  // Shot 5: Lifeboat (40-50s)
  { cs:[-10,4,40], ce:[-12,3.5,38], ls:[-5,2,27], le:[-5,2,28], ss:[0,0,Math.PI], se:[0,0.12,Math.PI-0.1], warm:2.0, alarm:0, impact:0, name:"救生艇 · Lifeboat" },
  // Shot 6: Sinking (50-60s)
  { cs:[-20,3,46], ce:[-24,3,50], ls:[0,0,8], le:[0,-4,10], ss:[0,0,Math.PI], se:[-9,-0.35,Math.PI-0.1], warm:0.15, alarm:0, impact:0, name:"沉没 · Sinking" }
];

// ========== Timeline UI ==========
const marksEl = document.getElementById('marks');
const trackEl = document.getElementById('track');
const infoEl = document.getElementById('info');
SHOTS.forEach((s, i) => {
  const m = document.createElement('div');
  m.className = 'mark' + (i===0?' active':'');
  m.textContent = `镜头 ${i+1} · ${s.name}`;
  m.dataset.index = i;
  marksEl.appendChild(m);
});

let t0 = 0;
let currentShot = 0;

// ========== Animation ==========
function lerp(a,b,t){ return a + (b-a)*t; }
function ease(t){ return t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }

function updateTimeline(t){
  // Progress bar
  const pct = Math.min(1, Math.max(0, t / TOTAL_TIME));
  trackEl.style.transform = `scaleX(${pct})`;

  // Shot index
  const si = Math.min(5, Math.floor(t / SHOT_DURATION));
  if(si !== currentShot){
    currentShot = si;
    document.querySelectorAll('.mark').forEach((m, i) => m.classList.toggle('active', i===si));
  }

  // Info panel
  const shot = SHOTS[si];
  const shotTime = t - si * SHOT_DURATION;
  infoEl.innerHTML = `
    <div class="shot-label">${shot.name}</div>
    <div>镜头 ${si+1} / 6</div>
    <div class="timecode">${shotTime.toFixed(1)}s / ${SHOT_DURATION}s</div>
    <div class="timecode">总计 ${t.toFixed(1)}s / ${TOTAL_TIME}s</div>
  `;
}

function animate(now){
  if(!t0) t0 = now;
  const t = (now - t0) / 1000;
  if(t >= TOTAL_TIME){ t0 = now - TOTAL_TIME * 1000; } // loop

  updateTimeline(t);

  const si = Math.min(5, Math.floor(t / SHOT_DURATION));
  const s = SHOTS[si];
  const localT = (t - si * SHOT_DURATION) / SHOT_DURATION;
  const tt = ease(localT);

  // Camera
  cam.position.set(lerp(s.cs[0], s.ce[0], tt), lerp(s.cs[1], s.ce[1], tt), lerp(s.cs[2], s.ce[2], tt));
  cam.lookAt(lerp(s.ls[0], s.le[0], tt), lerp(s.ls[1], s.le[1], tt), lerp(s.ls[2], s.le[2], tt));

  // Ship state
  if(ship){
    ship.position.set(0, lerp(s.ss[0], s.se[0], tt), 10);
    ship.rotation.z = lerp(s.ss[1], s.se[1], tt);
    ship.rotation.y = lerp(s.ss[2], s.se[2], tt);
  }

  // Iceberg position per shot
  if(iceberg){
    if(si === 1){ iceberg.position.set(-20, -3, -80); iceberg.scale.setScalar(0.7); }
    else if(si === 2){ iceberg.position.set(30, -3, -40); iceberg.scale.setScalar(1.2); }
    else { iceberg.position.set(-60, -4, -90); iceberg.scale.setScalar(1.0); }
  }

  // Lights
  warm.intensity = lerp(warm.intensity, s.warm, 0.08);
  alarm.intensity = s.alarm > 0 ? (0.6 + 0.6 * Math.sin(t * 8)) * s.alarm : 0;
  impact.intensity = s.impact;

  // Particles
  iceP.visible = (si === 2);
  waterP.visible = (si === 3);
  lifeboat.visible = (si === 4);
  mist.visible = (si === 4);

  if(si === 2){
    const pos = iceP.geometry.attributes.position, vel = iceP.geometry.attributes.vel;
    for(let i=0;i<pos.count;i++){
      pos.setX(i, pos.getX(i) + vel.getX(i)*0.02);
      pos.setY(i, pos.getY(i) - vel.getY(i)*0.02);
      pos.setZ(i, pos.getZ(i) + vel.getZ(i)*0.02);
    }
    pos.needsUpdate = true;
  }
  if(si === 3){
    const pos = waterP.geometry.attributes.position;
    for(let i=0;i<pos.count;i++) pos.setY(i, pos.getY(i) + 0.06);
    pos.needsUpdate = true;
  }

  // People visibility
  lookout.visible = (si === 0 || si === 1);
  deckPeople.forEach(p => p.visible = (si === 0));
  boatPeople.forEach((p, i) => { p.visible = (si === 4); p.rotation.x = Math.sin(t*1.5 + i)*0.08; });

  // Render
  renderer.render(scene, cam);
  postProcess(t, si);

  requestAnimationFrame(animate);
}

// ========== Post Processing (Film Look) ==========
function postProcess(t, si){
  octx.drawImage(glc, 0, 0, W, H);
  const img = octx.getImageData(0, 0, W, H);
  const px = img.data;
  const cx = W/2, cy = H/2, maxD = Math.sqrt(cx*cx + cy*cy);

  for(let i=0;i<px.length;i+=4){
    const x = (i/4) % W, y = Math.floor(i/4 / W);
    const dx = x - cx, dy = y - cy;
    const dist = Math.sqrt(dx*dx + dy*dy) / maxD;
    const vignette = Math.pow(1 - 0.45 * Math.pow(dist, 2.2), 1.3);

    const grain = (Math.random() - 0.5) * 14;

    let r = px[i], g = px[i+1], b = px[i+2];

    // Teal-orange grading
    r = Math.min(255, (r * 1.08 + 5) * vignette + grain);
    g = Math.min(255, (g * 1.00) * vignette + grain);
    b = Math.min(255, (b * 0.92 + 3) * vignette + grain);

    px[i] = r; px[i+1] = g; px[i+2] = b;
  }
  octx.putImageData(img, 0, 0);

  // Shot 5: sea mist glow
  if(si === 4){
    const grad = octx.createLinearGradient(0, H*0.55, 0, H*0.85);
    grad.addColorStop(0, 'rgba(160,185,210,0)');
    grad.addColorStop(1, 'rgba(160,185,210,0.22)');
    octx.fillStyle = grad;
    octx.fillRect(0, 0, W, H);
  }
  // Shot 6: fade to black
  if(si === 5){
    const fade = Math.max(0, (t - 52) / 8);
    if(fade > 0){
      octx.fillStyle = `rgba(0,0,0,${Math.min(1, fade*1.2)})`;
      octx.fillRect(0, 0, W, H);
    }
  }
}

// ========== Start ==========
function initTimeline(){
  // Initial camera
  cam.position.set(...SHOTS[0].cs);
  cam.lookAt(...SHOTS[0].ls);
  t0 = performance.now();
  requestAnimationFrame(animate);
}

// Click mark to seek
marksEl.addEventListener('click', e => {
  const m = e.target.closest('.mark');
  if(m){
    const idx = parseInt(m.dataset.index, 10);
    t0 = performance.now() - idx * SHOT_DURATION * 1000;
  }
});
</script>
</body>
</html>
