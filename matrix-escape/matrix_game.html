<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>黑客帝国 · Matrix Rain 游戏</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace}
  #c{display:block;width:100%;height:100%}
  #hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);color:#00ff88;
    font-size:15px;letter-spacing:2px;text-shadow:0 0 8px #00ff88;z-index:10;white-space:nowrap;
    background:rgba(0,10,0,.5);padding:8px 18px;border:1px solid rgba(0,255,136,.4);border-radius:4px}
  #start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:20;
    color:#00ff88;text-shadow:0 0 10px #00ff88}
  #start h1{font-size:34px;margin-bottom:10px;letter-spacing:4px}
  #start p{font-size:15px;margin-bottom:24px;color:#66ffbb;line-height:1.8}
  #startBtn{background:#001a00;color:#00ff88;border:2px solid #00ff88;padding:14px 46px;
    font-size:20px;font-family:inherit;cursor:pointer;letter-spacing:3px;transition:all .2s}
  #startBtn:hover{background:#00ff88;color:#000;box-shadow:0 0 30px #00ff88}
  #over{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:20;
    display:none;color:#ff5566;text-shadow:0 0 10px #ff5566}
  #over h1{font-size:38px;margin-bottom:14px;letter-spacing:4px}
  #over p{font-size:18px;color:#ff8899;margin-bottom:22px}
  #again{background:#1a0000;color:#ff5566;border:2px solid #ff5566;padding:12px 40px;
    font-size:18px;font-family:inherit;cursor:pointer;letter-spacing:3px;transition:all .2s}
  #again:hover{background:#ff5566;color:#000;box-shadow:0 0 30px #ff5566}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">☰ MATRIX <span id="score">0</span></div>
<div id="start">
  <h1>黑客帝国</h1>
  <p>操控尼奥躲避特工子弹，吃绿色药丸得分<br>↑↓←→ 或 WASD 移动 · 触屏拖动</p>
  <button id="startBtn">进入矩阵 ▶</button>
</div>
<div id="over">
  <h1>系统已连接</h1>
  <p id="final">得分 0</p>
  <button id="again">重新进入</button>
</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}rs();addEventListener('resize',rs);

// ===== Matrix 数字雨 =====
const fs=16,cols=Math.ceil(W/fs),drops=[],spd=[];
for(let i=0;i<cols;i++){drops[i]=Math.random()*H/fs;spd[i]=0.5+Math.random()*0.9;}
const glyph='01アイウエオカキクケコサシスセソ0123456789ABCDEF';
function rain(){
  cx.fillStyle='rgba(0,0,0,0.06)';cx.fillRect(0,0,W,H);
  cx.font=fs+'px monospace';
  for(let i=0;i<cols;i++){
    const ch=glyph[Math.floor(Math.random()*glyph.length)];
    cx.fillStyle=Math.random()<0.05?'#aaffcc':'#00ff88';
    cx.fillText(ch,i*fs,drops[i]*fs);
    if(drops[i]*fs>H&&Math.random()>0.975)drops[i]=0;
    drops[i]+=spd[i];
  }
}

// ===== 玩家(尼奥) =====
const player={x:W/2,y:H-90,s:22,spd:7};
function drawPlayer(){
  cx.save();cx.translate(player.x,player.y);
  cx.strokeStyle='#00ffcc';cx.lineWidth=2;cx.fillStyle='#002222';
  cx.beginPath();cx.moveTo(0,-player.s);cx.lineTo(player.s,player.s);cx.lineTo(0,player.s*0.4);
  cx.lineTo(-player.s,player.s);cx.closePath();cx.fill();cx.stroke();
  cx.restore();
}

// ===== 子弹 =====
let bullets=[],score=0,gameOn=false,raf;
function spawn(){
  if(Math.random()<0.03){
    const edge=Math.floor(Math.random()*4);let x,y,dx,dy;
    const spd=4+score*0.05+Math.random()*2;
    if(edge===0){x=Math.random()*W;y=-10;dx=0;dy=spd;}
    else if(edge===1){x=Math.random()*W;y=H+10;dx=0;dy=-spd;}
    else if(edge===2){x=-10;y=Math.random()*H;dx=spd;dy=0;}
    else{x=W+10;y=Math.random()*H;dx=-spd;dy=0;}
    bullets.push({x,y,dx,dy});
  }
}

// ===== 药丸 =====
let pills=[];
function spawnPill(){
  if(Math.random()<0.006)pills.push({x:Math.random()*W,y:Math.random()*H*0.7,r:8});
}

// ===== 输入 =====
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
// 触屏
let tX=null,tY=null;
addEventListener('touchstart',e=>{tX=e.touches[0].clientX;tY=e.touches[0].clientY;},{passive:true});
addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.touches[0],dx=t.clientX-tX,dy=t.clientY-tY;
  player.x+=dx;player.y+=dy;tX=t.clientX;tY=t.clientY;
},{passive:false});

function update(){
  if(keys['arrowleft']||keys['a'])player.x-=player.spd;
  if(keys['arrowright']||keys['d'])player.x+=player.spd;
  if(keys['arrowup']||keys['w'])player.y-=player.spd;
  if(keys['arrowdown']||keys['s'])player.y+=player.spd;
  player.x=Math.max(10,Math.min(W-10,player.x));
  player.y=Math.max(20,Math.min(H-10,player.y));

  spawn();spawnPill();
  bullets=bullets.filter(b=>b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);
  bullets.forEach(b=>{b.x+=b.dx;b.y+=b.dy;});
  // 碰撞: 子弹
  for(const b of bullets){
    if(Math.abs(b.x-player.x)<player.s&&Math.abs(b.y-player.y)<player.s){gameOver();return;}
  }
  // 药丸
  pills=pills.filter(p=>{
    const hit=Math.hypot(p.x-player.x,p.y-player.y)<player.s+p.r;
    if(hit){score+=10;document.getElementById('score').textContent=score;cx.fillStyle='#00ff88';cx.fillRect(0,0,W,H);}
    return !hit;
  });
  pills.forEach(p=>{p.y+=1.2;});
  pills=pills.filter(p=>p.y<H+20);
}

function drawBullets(){
  bullets.forEach(b=>{
    cx.fillStyle='#ff3355';cx.beginPath();cx.arc(b.x,b.y,4,0,Math.PI*2);cx.fill();
    cx.strokeStyle='rgba(255,51,85,.5)';cx.beginPath();cx.arc(b.x,b.y,9,0,Math.PI*2);cx.stroke();
  });
}
function drawPills(){
  pills.forEach(p=>{
    cx.fillStyle='#00ff88';cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();
    cx.fillStyle='#00aa55';cx.beginPath();cx.arc(p.x-2,p.y-2,p.r*0.5,0,Math.PI*2);cx.fill();
  });
}

function loop(){
  if(!gameOn)return;
  rain();drawBullets();drawPills();drawPlayer();update();
  raf=requestAnimationFrame(loop);
}

function gameOver(){
  gameOn=false;cancelAnimationFrame(raf);
  document.getElementById('over').style.display='block';
  document.getElementById('final').textContent='得分 '+score;
  cx.fillStyle='rgba(0,0,0,0.85)';cx.fillRect(0,0,W,H);
  cx.fillStyle='#ff5566';cx.font='30px monospace';cx.textAlign='center';
  cx.fillText('SYSTEM FAILURE',W/2,H/2-60);
  cx.textAlign='left';
}

function start(){
  score=0;bullets=[];pills=[];player.x=W/2;player.y=H-90;
  document.getElementById('score').textContent='0';
  document.getElementById('start').style.display='none';
  document.getElementById('over').style.display='none';
  gameOn=true;loop();
}

document.getElementById('startBtn').onclick=start;
document.getElementById('again').onclick=start;

// 启动即渲染背景雨(菜单)
(function idle(){rain();requestAnimationFrame(idle);})();
</script>
</body>
</html>
